<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCH AI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --user-msg: #2b2b36;
      --ai-msg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #4f46e5;
      --accent-hover: #4338ca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 1rem 2rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      padding: 0.85rem 1.15rem;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background-color: var(--ai-msg);
      border: 1px solid #333;
      border-bottom-left-radius: 2px;
    }

    .message p {
      margin-bottom: 0.5rem;
    }

    .message p:last-child {
      margin-bottom: 0;
    }

    .input-area {
      padding: 1rem 1.5rem;
      background-color: var(--card-bg);
      border-top: 1px solid #333;
      display: flex;
      justify-content: center;
    }

    .input-container {
      display: flex;
      width: 100%;
      max-width: 800px;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #121212;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    button {
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 8px;
      background-color: var(--accent-color);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="chat-title">ARCH AI</h1>
    <button onclick="startNewChat()">New Chat</button>
  </header>

  <div class="chat-container" id="chat-container"></div>

  <div class="input-area">
    <div class="input-container">
      <input type="text" id="user-input" placeholder="Type your message..." onkeydown="handleKeyPress(event)" />
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // Maintains state across multiple messages
    let chatHistory = [];
    let isFirstMessage = true;

    async function sendMessage() {
      const inputEl = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const prompt = inputEl.value.trim();

      if (!prompt) return;

      // Render User Message
      appendMessage("user", prompt);
      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;

      // Handle Title Generation on initial prompt
      if (isFirstMessage) {
        generateTitle(prompt);
        isFirstMessage = false;
      }

      // Render Placeholder Assistant Message
      const assistantMessageId = appendMessage("assistant", "Thinking...");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: prompt,
            history: chatHistory // Sends entire preceding context array
          })
        });

        const data = await response.json();

        if (response.ok && data.response) {
          // Update AI Message Container with Markdown
          const assistantMsgEl = document.getElementById(assistantMessageId);
          assistantMsgEl.innerHTML = marked.parse(data.response);

          // Append completed turn to global history state
          chatHistory.push({ role: "user", content: prompt });
          chatHistory.push({ role: "assistant", content: data.response });
        } else {
          updateMessage(assistantMessageId, "Error: " + (data.detail || "Failed to generate response."));
        }
      } catch (err) {
        updateMessage(assistantMessageId, "Error connecting to backend server.");
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    async function generateTitle(prompt) {
      try {
        const res = await fetch("/title", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: prompt })
        });
        const data = await res.json();
        if (data.title) {
          document.getElementById("chat-title").innerText = data.title;
        }
      } catch (e) {
        // Keep default header on failure
      }
    }

    function appendMessage(role, content) {
      const container = document.getElementById("chat-container");
      const msgDiv = document.createElement("div");
      const msgId = "msg-" + Date.now();

      msgDiv.id = msgId;
      msgDiv.classList.add("message", role);
      msgDiv.innerHTML = role === "assistant" ? marked.parse(content) : escapeHtml(content);

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
      return msgId;
    }

    function updateMessage(id, text) {
      const el = document.getElementById(id);
      if (el) {
        el.innerText = text;
      }
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    }

    function startNewChat() {
      chatHistory = [];
      isFirstMessage = true;
      document.getElementById("chat-container").innerHTML = "";
      document.getElementById("chat-title").innerText = "ARCH AI";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
