<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCH AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #chat-container {
            width: 90%;
            max-width: 600px;
            height: 70vh;
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #messages {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            max-width: 80%;
            line-height: 1.4;
        }
        .user {
            background-color: #007bff;
            align-self: flex-end;
        }
        .bot {
            background-color: #333333;
            align-self: flex-start;
        }
        #input-container {
            display: flex;
            gap: 10px;
        }
        input {
            flex-grow: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <h2>ARCH AI Interface</h2>
        <div id="messages"></div>
        <div id="input-container">
            <input type="text" id="prompt-input" placeholder="Ask ARCH AI..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("prompt-input");
            const messages = document.getElementById("messages");
            const prompt = input.value.trim();

            if (!prompt) return;

            const userMsg = document.createElement("div");
            userMsg.className = "message user";
            userMsg.innerText = prompt;
            messages.appendChild(userMsg);
            input.value = "";

            messages.scrollTop = messages.scrollHeight;

            try {
                // Relative path works automatically for local server and Vercel deployments
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                const botMsg = document.createElement("div");
                botMsg.className = "message bot";
                botMsg.innerText = data.response || data.detail || "No response generated.";
                messages.appendChild(botMsg);
            } catch (error) {
                const errorMsg = document.createElement("div");
                errorMsg.className = "message bot";
                errorMsg.innerText = "Error connecting to backend server.";
                messages.appendChild(errorMsg);
            }

            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
