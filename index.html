<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCH AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; height: 100vh; background-color: #212121; color: #ececec; overflow: hidden; }

        /* Sidebar Styling */
        #sidebar {
            width: 260px;
            background-color: #171717;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        #sidebar.closed { transform: translateX(-100%); position: absolute; height: 100%; }

        .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .new-chat-btn {
            display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 10px 12px; border-radius: 8px; border: 1px solid #424242;
            background: transparent; color: #fff; cursor: pointer; text-align: left;
            font-size: 14px; font-weight: 500;
        }
        .new-chat-btn:hover { background-color: #2f2f2f; }

        .chat-history { flex-grow: 1; overflow-y: auto; margin-top: 15px; display: flex; flex-direction: column; gap: 5px; }
        .history-item {
            padding: 10px; border-radius: 8px; font-size: 14px; color: #b4b4b4;
            cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .history-item:hover, .history-item.active { background-color: #212121; color: #fff; }

        /* Main Chat Window */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; }
        header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #2f2f2f; }
        .icon-btn { background: none; border: none; color: #b4b4b4; cursor: pointer; padding: 6px; border-radius: 6px; }
        .icon-btn:hover { background-color: #2f2f2f; color: #fff; }

        #messages { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .message-row { display: flex; width: 100%; max-width: 768px; margin: 0 auto; gap: 12px; }
        .user-row { justify-content: flex-end; }
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; max-width: 85%; word-break: break-word; }
        .user-row .bubble { background-color: #2f2f2f; color: #fff; border-bottom-right-radius: 4px; }
        .bot-row .bubble { background-color: transparent; color: #ececec; }

        /* Input Bar */
        #input-container { padding: 15px; display: flex; justify-content: center; background-color: #212121; }
        .input-box {
            display: flex; align-items: center; width: 100%; max-width: 768px;
            background-color: #2f2f2f; border-radius: 24px; padding: 8px 16px;
        }
        input { flex-grow: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; padding: 8px; }
        .send-btn { background-color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100%; }
            #sidebar.closed { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div>
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="startNewChat()">
                    <span>+</span> New chat
                </button>
            </div>
            <div class="chat-history" id="chat-history"></div>
        </div>
        <div style="font-size: 12px; color: #666; text-align: center; padding: 10px;">ARCH AI v2.0</div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <header>
            <button class="icon-btn" onclick="toggleSidebar()">☰</button>
            <span style="font-weight: 600;" id="chat-title">ARCH AI</span>
        </header>

        <div id="messages"></div>

        <div id="input-container">
            <div class="input-box">
                <input type="text" id="prompt-input" placeholder="Message ARCH AI or ask for weather..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" id="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        let chats = {};
        let currentChatId = null;

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("closed");
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            chats[currentChatId] = { title: "New Chat", messages: [] };
            document.getElementById("messages").innerHTML = "";
            document.getElementById("chat-title").innerText = "ARCH AI";
            renderHistory();
        }

        function renderHistory() {
            const historyContainer = document.getElementById("chat-history");
            historyContainer.innerHTML = "";
            Object.keys(chats).reverse().forEach(id => {
                const item = document.createElement("div");
                item.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                item.innerText = chats[id].title;
                item.onclick = () => loadChat(id);
                historyContainer.appendChild(item);
            });
        }

        function loadChat(id) {
            currentChatId = id;
            document.getElementById("chat-title").innerText = chats[id].title;
            const messagesDiv = document.getElementById("messages");
            messagesDiv.innerHTML = "";
            chats[id].messages.forEach(msg => appendMessageUI(msg.sender, msg.text));
            renderHistory();
        }

        function appendMessageUI(sender, text) {
            const messagesDiv = document.getElementById("messages");
            const row = document.createElement("div");
            row.className = `message-row ${sender === 'user' ? 'user-row' : 'bot-row'}`;
            
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.innerText = text;

            row.appendChild(bubble);
            messagesDiv.appendChild(row);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById("prompt-input");
            const prompt = input.value.trim();
            if (!prompt) return;

            if (!currentChatId) startNewChat();

            input.value = "";
            appendMessageUI("user", prompt);
            chats[currentChatId].messages.push({ sender: "user", text: prompt });

            // Auto-Generate Title on First Message
            if (chats[currentChatId].messages.length === 1) {
                fetch("/title", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                }).then(res => res.json()).then(data => {
                    chats[currentChatId].title = data.title;
                    document.getElementById("chat-title").innerText = data.title;
                    renderHistory();
                }).catch(() => {});
            }

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                const reply = data.response || data.detail || "No response received.";

                appendMessageUI("bot", reply);
                chats[currentChatId].messages.push({ sender: "bot", text: reply });
            } catch (error) {
                appendMessageUI("bot", "Error connecting to server.");
            }
        }

        // Initialize first session
        startNewChat();
    </script>
</body>
</html>
